<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirVision | Instant AQI Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.5s ease; }
        .aqi-card { border-radius: 28px; transition: transform 0.3s ease; position: relative; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark .glass { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <h1 class="text-2xl font-800 tracking-tighter flex items-center gap-2">
            <i data-lucide="wind" class="text-blue-500"></i> AirVision
        </h1>
        <div class="flex gap-3">
            <button id="themeToggle" class="p-3 rounded-full glass hover:scale-110 transition-all">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 space-y-8">
        
        <section class="glass p-6 rounded-[32px] shadow-xl">
            <div class="flex flex-col md:flex-row gap-3">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-4 top-4 text-slate-400 w-5 h-5"></i>
                    <input type="text" id="cityInput" placeholder="Enter city (e.g., Tokyo, Delhi, New York)" 
                           class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white dark:bg-slate-800 border-none focus:ring-2 focus:ring-blue-500 outline-none text-lg shadow-inner">
                </div>
                <button onclick="searchCity()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-2xl font-bold transition-all shadow-lg active:scale-95">
                    Check Air
                </button>
                <button onclick="getUserLocation()" class="p-4 bg-slate-200 dark:bg-slate-800 rounded-2xl hover:bg-slate-300 transition-all" title="Current Location">
                    <i data-lucide="map-pin"></i>
                </button>
            </div>
            <div class="mt-4 flex gap-2">
                <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Popular:</span>
                <button onclick="quickSearch('London')" class="text-xs hover:text-blue-500">London</button>
                <button onclick="quickSearch('Paris')" class="text-xs hover:text-blue-500">Paris</button>
                <button onclick="quickSearch('Beijing')" class="text-xs hover:text-blue-500">Beijing</button>
            </div>
        </section>

        <div id="displayArea" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8 items-start">
             <div id="welcomeMsg" class="col-span-full py-20 text-center opacity-50">
                <i data-lucide="info" class="mx-auto w-12 h-12 mb-4"></i>
                <p class="text-xl">Search for a city or use your location to see air quality.</p>
             </div>
        </div>

    </main>

    <script>
        // PUBLIC DEMO TOKEN PROVIDED BY WAQI (No individual key required)
        const PUBLIC_TOKEN = "demo"; 
        
        const displayArea = document.getElementById('displayArea');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        let isDark = false;

        lucide.createIcons();

        // Theme Logic
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.classList.toggle('dark');
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        });

        function getAQIConfig(aqi) {
            if (aqi <= 50) return { label: 'Good', color: 'bg-emerald-500', emoji: '😊', tip: 'Air is clean! Great for a walk. 🌿' };
            if (aqi <= 100) return { label: 'Moderate', color: 'bg-yellow-400 text-slate-900', emoji: '😐', tip: 'Sensitive people should limit outdoor time. 😷' };
            if (aqi <= 150) return { label: 'Unhealthy (S)', color: 'bg-orange-500', emoji: '🤨', tip: 'Avoid prolonged outdoor exertion. ⚠️' };
            if (aqi <= 200) return { label: 'Unhealthy', color: 'bg-red-500', emoji: '😷', tip: 'Everyone may experience health effects. ❌' };
            if (aqi <= 300) return { label: 'Very Unhealthy', color: 'bg-purple-600', emoji: '💀', tip: 'Health alert: Stay indoors! 🏠' };
            return { label: 'Hazardous', color: 'bg-rose-950 text-white', emoji: '🌋', tip: 'Emergency conditions. Use purifiers. 🚨' };
        }

        async function fetchAQI(query) {
            try {
                const response = await fetch(`https://api.waqi.info/feed/${query}/?token=${PUBLIC_TOKEN}`);
                const data = await response.json();
                if (data.status !== "ok") throw new Error("City not found");
                return data.data;
            } catch (err) {
                alert("Error: " + err.message);
                return null;
            }
        }

        function createCard(data) {
            const config = getAQIConfig(data.aqi);
            const cardId = `card-${Math.random().toString(36).substr(2, 9)}`;
            
            return `
                <div id="${cardId}" class="aqi-card p-8 ${config.color} shadow-2xl transition-all hover:scale-[1.02]">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-3xl font-800 leading-tight">${data.city.name.split(',')[0]}</h2>
                            <p class="opacity-70 text-sm font-semibold">${new Date().toLocaleDateString()}</p>
                        </div>
                        <span class="text-6xl animate-float">${config.emoji}</span>
                    </div>

                    <div class="flex items-baseline gap-3 mb-8">
                        <h3 class="text-8xl font-black tracking-tighter">${data.aqi}</h3>
                        <div class="mb-2">
                            <p class="text-xl font-bold leading-none">${config.label}</p>
                            <p class="text-xs opacity-75 uppercase tracking-widest mt-1">AQI Index</p>
                        </div>
                    </div>

                    <div class="glass p-4 rounded-2xl mb-6 bg-white/10">
                        <p class="font-bold text-center italic">"${config.tip}"</p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="downloadAsImage('${cardId}', '${data.city.name}')" class="flex items-center justify-center gap-2 bg-black/20 hover:bg-black/40 py-4 rounded-xl font-bold transition-all">
                            <i data-lucide="download" class="w-5"></i> Wallpaper
                        </button>
                        <button onclick="shareCard('${cardId}')" class="flex items-center justify-center gap-2 bg-white/20 hover:bg-white/40 py-4 rounded-xl font-bold transition-all">
                            <i data-lucide="share-2" class="w-5"></i> Share
                        </button>
                    </div>
                    
                    <p class="text-[10px] text-center mt-6 opacity-40 uppercase tracking-widest">Powered by AirVision x WAQI</p>
                </div>
            `;
        }

        async function searchCity() {
            const city = document.getElementById('cityInput').value;
            if (!city) return;
            const data = await fetchAQI(city);
            if (data) {
                document.getElementById('welcomeMsg')?.remove();
                displayArea.innerHTML = createCard(data) + displayArea.innerHTML;
                lucide.createIcons();
            }
        }

        function quickSearch(city) {
            document.getElementById('cityInput').value = city;
            searchCity();
        }

        function getUserLocation() {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const data = await fetchAQI(`geo:${pos.coords.latitude};${pos.coords.longitude}`);
                if (data) {
                    document.getElementById('welcomeMsg')?.remove();
                    displayArea.innerHTML = createCard(data) + displayArea.innerHTML;
                    lucide.createIcons();
                }
            });
        }

        async function downloadAsImage(id, cityName) {
            const card = document.getElementById(id);
            const canvas = await html2canvas(card, { scale: 3, borderRadius: 28 });
            const link = document.createElement('a');
            link.download = `AirVision-${cityName.trim()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        async function shareCard(id) {
            const card = document.getElementById(id);
            const canvas = await html2canvas(card, { scale: 2 });
            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'air-quality.png', { type: 'image/png' });
                if (navigator.share) {
                    await navigator.share({ files: [file], title: 'My Air Quality', text: 'Check the air in my city!' });
                } else {
                    alert("Download starting...");
                    downloadAsImage(id, 'AQI-Share');
                }
            });
        }

        window.onload = () => {
            // Check location on start
            getUserLocation();
        };
    </script>
</body>
</html>
